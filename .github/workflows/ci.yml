name: CI - Física Quest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Compilar, testear y analizar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar el proyecto (debug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Ejecutar pruebas unitarias
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Analizar con Lint
        run: gradle lintDebug --no-daemon --stacktrace

      - name: Publicar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: app/build/reports/tests/

      - name: Publicar reporte de Lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-lint
          path: app/build/reports/lint-results-debug.html

      - name: Publicar APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: FisicaQuest-debug
          path: app/build/outputs/apk/debug/app-debug.apk
