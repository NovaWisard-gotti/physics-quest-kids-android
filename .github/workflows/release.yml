name: Release - Física Quest

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  release:
    name: Compilar y publicar el APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar el APK de release
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Determinar el nombre de la versión
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Renombrar el APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/FisicaQuest-v${{ steps.version.outputs.version }}.apk"

      - name: Publicar la Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "Física Quest v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          body: |
            🚀 **Física Quest v${{ steps.version.outputs.version }}**

            Aventura educativa de física para niños y niñas de 8 a 12 años.
            Cinco mundos, 30 niveles, 5 desafíos de jefe científico, 25 tarjetas de concepto y 8 insignias.

            📦 APK: `FisicaQuest-v${{ steps.version.outputs.version }}.apk`

            ⚠️ Este APK no está firmado con una clave de producción (firma "unsigned" generada por
            el propio flujo de compilación). Antes de publicarlo en una tienda de aplicaciones,
            firma el paquete con tu propia clave de firma.
          files: dist/FisicaQuest-v${{ steps.version.outputs.version }}.apk
